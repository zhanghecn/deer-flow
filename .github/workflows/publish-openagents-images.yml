name: Publish OpenAgents Images

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish, for example vX.Y.Z
        required: true
        type: string
      push:
        description: Push images to configured registries
        required: false
        default: true
        type: boolean

concurrency:
  group: publish-openagents-images-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: web
            dockerfile: docker/nginx/Dockerfile.prod
            context: .
          - service: gateway
            dockerfile: backend/gateway/Dockerfile
            context: .
          - service: langgraph
            dockerfile: backend/agents/Dockerfile
            context: .
          - service: sandbox-aio
            dockerfile: sandbox-aio/Dockerfile
            context: docker
          - service: onlyoffice
            dockerfile: onlyoffice/Dockerfile
            context: docker
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Set image version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            tag="${{ github.event.inputs.tag }}"
            tag="${tag#refs/tags/}"
            if [[ "$tag" != v* ]]; then
              echo "Release tag must start with v, got: $tag" >&2
              exit 1
            fi
            version="${tag#v}"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            echo "This workflow must run from a release tag." >&2
            exit 1
          fi
          # The immutable release tag comes from git, while `latest` is also
          # refreshed so operators can update with a plain pull/up flow.
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set image tags
        id: image-tags
        shell: bash
        env:
          DOCKERHUB_IMAGE_PREFIX: ${{ vars.DOCKERHUB_IMAGE_PREFIX }}
          GHCR_OWNER: ${{ github.repository_owner }}
          SERVICE: ${{ matrix.service }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          ghcr_owner="$(printf '%s' "$GHCR_OWNER" | tr '[:upper:]' '[:lower:]')"
          dockerhub_prefix=""
          if [[ -n "$DOCKERHUB_USERNAME" ]]; then
            dockerhub_prefix="$DOCKERHUB_IMAGE_PREFIX"
            if [[ -z "$dockerhub_prefix" ]]; then
              # Keep DockerHub image names aligned with deploy/.env.example:
              # <dockerhub-user>/openagents-<service>:<version|latest>.
              dockerhub_prefix="${DOCKERHUB_USERNAME}/openagents"
            fi
          fi

          {
            echo "tags<<EOF"
            if [[ -n "$dockerhub_prefix" ]]; then
              echo "${dockerhub_prefix}-${SERVICE}:${VERSION}"
              echo "${dockerhub_prefix}-${SERVICE}:latest"
            fi
            echo "ghcr.io/${ghcr_owner}/openagents-${SERVICE}:${VERSION}"
            echo "ghcr.io/${ghcr_owner}/openagents-${SERVICE}:latest"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to DockerHub
        if: ${{ (github.event_name == 'push' || inputs.push) && env.DOCKERHUB_USERNAME != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR
        if: ${{ github.event_name == 'push' || inputs.push }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and optionally push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name == 'push' || inputs.push }}
          tags: ${{ steps.image-tags.outputs.tags }}
          cache-from: type=gha,scope=openagents-${{ matrix.service }}
          cache-to: type=gha,scope=openagents-${{ matrix.service }},mode=max
          provenance: false
