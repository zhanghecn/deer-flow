name: Publish OpenAgents Images

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Image version tag to publish
        required: false
        default: latest
        type: string
      push:
        description: Push images to GHCR
        required: false
        default: true
        type: boolean

concurrency:
  group: publish-openagents-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: web
            dockerfile: docker/nginx/Dockerfile.prod
            context: .
          - service: gateway
            dockerfile: backend/gateway/Dockerfile
            context: .
          - service: langgraph
            dockerfile: backend/agents/Dockerfile
            context: .
          - service: sandbox-aio
            dockerfile: sandbox-aio/Dockerfile
            context: docker
          - service: onlyoffice
            dockerfile: onlyoffice/Dockerfile
            context: docker
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set image version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="${{ inputs.version }}"
          fi
          # Keep the release tag as the single operator-visible version. Image
          # names carry the service identity, so tags stay plain versions.
          echo "version=${version:-latest}" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: ${{ github.event_name == 'push' || inputs.push }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and optionally push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name == 'push' || inputs.push }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/openagents-${{ matrix.service }}:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/openagents-${{ matrix.service }}:latest
          cache-from: type=gha,scope=openagents-${{ matrix.service }}
          cache-to: type=gha,scope=openagents-${{ matrix.service }},mode=max
          provenance: false
