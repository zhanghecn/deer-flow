name: openagents

networks:
  default:
    # Production uses one stable operator-owned bridge. Attach an existing
    # OpenAI-compatible model gateway to this network with alias
    # `model-gateway`; model rows should then use
    # base_url=http://model-gateway:3000.
    external: true
    name: ${OPENAGENTS_DOCKER_NETWORK:-openagents}

x-openagents-env-file: &openagents_env_file
  # Deploy secrets live next to this compose file. The file is optional so CI
  # can still render config with process environment variables only.
  - path: ${OPENAGENTS_ENV_FILE:-.env}
    required: false

x-json-logging: &json_logging
  # Bound single-node log growth while keeping normal `docker compose logs`
  # behavior for operators.
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

x-openagents-home-mount: &openagents_home_mount
  # This directory is the movable runtime data root: archived agents, skills,
  # user thread files, commands, and runtime-generated state live here.
  type: bind
  source: ${OPENAGENTS_DOCKER_HOST_HOME:-./data/openagents}
  target: /openagents-home

x-openagents-sandbox-mount: &openagents_sandbox_mount
  # The sandbox service sees the same bytes at /openagents so runtime path
  # rewrites can preserve the /mnt/user-data/... contract independent of host
  # filesystem layout.
  type: bind
  source: ${OPENAGENTS_DOCKER_HOST_HOME:-./data/openagents}
  target: /openagents

x-openagents-logs-mount: &openagents_logs_mount
  # Application services mirror production logs here while stdout/stderr still
  # feed Docker's own compose logs for live troubleshooting.
  type: bind
  source: ${OPENAGENTS_LOG_DIR:-./data/logs}
  target: /openagents-logs

services:
  postgres:
    image: postgres:16-alpine
    environment:
      # Keep PGDATA explicit so a future image default cannot initialize a
      # second database under an anonymous Docker volume.
      PGDATA: /var/lib/postgresql/data
      POSTGRES_DB: ${OPENAGENTS_POSTGRES_DB:-openagents}
      POSTGRES_USER: ${OPENAGENTS_POSTGRES_USER:-openagents}
      POSTGRES_PASSWORD: ${OPENAGENTS_POSTGRES_PASSWORD:?OPENAGENTS_POSTGRES_PASSWORD is required; run scripts/docker-deploy.sh}
    ports:
      - "${OPENAGENTS_POSTGRES_BIND_HOST:-0.0.0.0}:${OPENAGENTS_POSTGRES_PORT:-15432}:5432"
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    volumes:
      - type: bind
        # PostgreSQL bytes stay in deploy/data for simple rsync/tar migration.
        source: ${OPENAGENTS_POSTGRES_DATA_DIR:-./data/postgres}
        target: /var/lib/postgresql/data
    logging: *json_logging
    restart: unless-stopped

  migrate:
    image: postgres:16-alpine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # The migration runner uses libpq environment variables so the exact same
      # script can run as a one-shot compose service or through `compose run`.
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: ${OPENAGENTS_POSTGRES_DB:-openagents}
      PGUSER: ${OPENAGENTS_POSTGRES_USER:-openagents}
      PGPASSWORD: ${OPENAGENTS_POSTGRES_PASSWORD:?OPENAGENTS_POSTGRES_PASSWORD is required; run scripts/docker-deploy.sh}
      MIGRATIONS_DIR: /migrations
    volumes:
      - type: bind
        # scripts/docker-deploy.sh syncs reviewed root migrations into deploy/
        # so the runtime deploy package can apply SQL without reading docker/.
        source: ${OPENAGENTS_MIGRATIONS_DIR:-./migrations}
        target: /migrations
        read_only: true
    entrypoint: ["/bin/sh", "/migrations/run.sh"]
    logging: *json_logging
    restart: "no"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${OPENAGENTS_MINIO_ROOT_USER:-openagents}
      MINIO_ROOT_PASSWORD: ${OPENAGENTS_MINIO_ROOT_PASSWORD:?OPENAGENTS_MINIO_ROOT_PASSWORD is required; run scripts/docker-deploy.sh}
    ports:
      # The app talks to MinIO over the deploy network. Host exposure stays
      # loopback-only unless an operator deliberately places a proxy in front.
      - "127.0.0.1:${OPENAGENTS_MINIO_API_PORT:-19000}:9000"
      - "127.0.0.1:${OPENAGENTS_MINIO_CONSOLE_PORT:-19001}:9001"
    volumes:
      - type: bind
        # Knowledge-base binary assets live here when KNOWLEDGE_OBJECT_STORE=minio.
        source: ${OPENAGENTS_MINIO_DATA_DIR:-./data/minio}
        target: /data
    logging: *json_logging
    restart: unless-stopped

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: ${OPENAGENTS_MINIO_ROOT_USER:-openagents}
      MINIO_ROOT_PASSWORD: ${OPENAGENTS_MINIO_ROOT_PASSWORD:?OPENAGENTS_MINIO_ROOT_PASSWORD is required; run scripts/docker-deploy.sh}
      KNOWLEDGE_S3_BUCKET: ${KNOWLEDGE_S3_BUCKET:-openagents-knowledge}
    entrypoint: ["/bin/sh", "-lc"]
    command:
      - |
        until mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"; do
          sleep 2
        done
        # Bucket creation is idempotent; redeploys must not mutate existing
        # document objects or require a separate first-run command.
        mc mb --ignore-existing "local/$${KNOWLEDGE_S3_BUCKET}"
    logging: *json_logging
    restart: "no"

  sandbox-aio:
    image: ${OPENAGENTS_SANDBOX_AIO_IMAGE:-${OPENAGENTS_IMAGE_REGISTRY:-docker.io}/${OPENAGENTS_IMAGE_PREFIX:-zhangxuan2/openagents}-sandbox-aio:${OPENAGENTS_VERSION:-latest}}
    env_file: *openagents_env_file
    ports:
      - "${OPENAGENTS_SANDBOX_PORT:-18080}:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/v1/sandbox"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s
    security_opt:
      - seccomp=unconfined
      - apparmor=unconfined
      - systempaths=unconfined
    volumes:
      - *openagents_home_mount
      - *openagents_sandbox_mount
    logging: *json_logging
    restart: unless-stopped

  onlyoffice:
    image: ${OPENAGENTS_ONLYOFFICE_IMAGE:-${OPENAGENTS_IMAGE_REGISTRY:-docker.io}/${OPENAGENTS_IMAGE_PREFIX:-zhangxuan2/openagents}-onlyoffice:${OPENAGENTS_VERSION:-latest}}
    env_file: *openagents_env_file
    environment:
      JWT_ENABLED: "true"
    ports:
      - "${OPENAGENTS_ONLYOFFICE_PORT:-8082}:80"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1/healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 8
      start_period: 90s
    logging: *json_logging
    restart: unless-stopped

  langgraph:
    image: ${OPENAGENTS_LANGGRAPH_IMAGE:-${OPENAGENTS_IMAGE_REGISTRY:-docker.io}/${OPENAGENTS_IMAGE_PREFIX:-zhangxuan2/openagents}-langgraph:${OPENAGENTS_VERSION:-latest}}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
      sandbox-aio:
        condition: service_healthy
    env_file: *openagents_env_file
    environment:
      DATABASE_URI: ${OPENAGENTS_DATABASE_URI:-postgresql://${OPENAGENTS_POSTGRES_USER:-openagents}:${OPENAGENTS_POSTGRES_PASSWORD:?OPENAGENTS_POSTGRES_PASSWORD is required; run scripts/docker-deploy.sh}@postgres:5432/${OPENAGENTS_POSTGRES_DB:-openagents}?sslmode=disable}
      OPENAGENTS_HOME: /openagents-home
      OPENAGENTS_CONFIG_PATH: /app/config.yaml
      OPENAGENTS_LANGGRAPH_CONFIG_PATH: /app/backend/agents/langgraph.json
      OPENAGENTS_EXTENSIONS_CONFIG_PATH: /openagents-home/extensions_config.json
      OPENAGENTS_SANDBOX_BASE_URL: http://sandbox-aio:8080
      OPENAGENTS_SANDBOX_SHARED_DATA_MOUNT_PATH: /openagents
      OPENAGENTS_LANGGRAPH_LOG_FILE: ${OPENAGENTS_LANGGRAPH_LOG_FILE:-/openagents-logs/langgraph.log}
      OPENAGENTS_LOG_MAX_SIZE_MB: ${OPENAGENTS_LOG_MAX_SIZE_MB:-100}
      OPENAGENTS_LOG_MAX_BACKUPS: ${OPENAGENTS_LOG_MAX_BACKUPS:-10}
      KNOWLEDGE_OBJECT_STORE: ${KNOWLEDGE_OBJECT_STORE:-minio}
      KNOWLEDGE_S3_ENDPOINT: ${KNOWLEDGE_S3_ENDPOINT:-http://minio:9000}
      KNOWLEDGE_S3_ACCESS_KEY: ${KNOWLEDGE_S3_ACCESS_KEY:-${OPENAGENTS_MINIO_ROOT_USER:-openagents}}
      KNOWLEDGE_S3_SECRET_KEY: ${KNOWLEDGE_S3_SECRET_KEY:-${OPENAGENTS_MINIO_ROOT_PASSWORD:?OPENAGENTS_MINIO_ROOT_PASSWORD is required; run scripts/docker-deploy.sh}}
      KNOWLEDGE_S3_BUCKET: ${KNOWLEDGE_S3_BUCKET:-openagents-knowledge}
      PYTHONPATH: /app/backend/agents
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - *openagents_home_mount
      - *openagents_logs_mount
      - type: bind
        # Root runtime config is operator-owned; image tags carry code only.
        source: ${OPENAGENTS_CONFIG_FILE:-./config.yaml}
        target: /app/config.yaml
        read_only: true
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:2024/docs"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 120s
    logging: *json_logging
    restart: unless-stopped

  gateway:
    image: ${OPENAGENTS_GATEWAY_IMAGE:-${OPENAGENTS_IMAGE_REGISTRY:-docker.io}/${OPENAGENTS_IMAGE_PREFIX:-zhangxuan2/openagents}-gateway:${OPENAGENTS_VERSION:-latest}}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      langgraph:
        condition: service_healthy
      onlyoffice:
        condition: service_healthy
      sandbox-aio:
        condition: service_healthy
    env_file: *openagents_env_file
    environment:
      DATABASE_URI: ${OPENAGENTS_DATABASE_URI:-postgresql://${OPENAGENTS_POSTGRES_USER:-openagents}:${OPENAGENTS_POSTGRES_PASSWORD:?OPENAGENTS_POSTGRES_PASSWORD is required; run scripts/docker-deploy.sh}@postgres:5432/${OPENAGENTS_POSTGRES_DB:-openagents}?sslmode=disable}
      GATEWAY_CONFIG_PATH: /app/backend/gateway/gateway.yaml
      OPENAGENTS_CONFIG_PATH: /app/config.yaml
      LANGGRAPH_URL: http://langgraph:2024
      OPENAGENTS_GATEWAY_LOG_FILE: ${OPENAGENTS_GATEWAY_LOG_FILE:-/openagents-logs/gateway.log}
      OPENAGENTS_LOG_MAX_SIZE_MB: ${OPENAGENTS_LOG_MAX_SIZE_MB:-100}
      OPENAGENTS_LOG_MAX_BACKUPS: ${OPENAGENTS_LOG_MAX_BACKUPS:-10}
      ONLYOFFICE_SERVER_URL: /onlyoffice
      ONLYOFFICE_INTERNAL_SERVER_URL: http://onlyoffice:80
      ONLYOFFICE_PUBLIC_APP_URL: http://gateway:8001
      OPENAGENTS_HOME: /openagents-home
      OPENAGENTS_EXTENSIONS_CONFIG_PATH: /openagents-home/extensions_config.json
      KNOWLEDGE_OBJECT_STORE: ${KNOWLEDGE_OBJECT_STORE:-minio}
      KNOWLEDGE_S3_ENDPOINT: ${KNOWLEDGE_S3_ENDPOINT:-http://minio:9000}
      KNOWLEDGE_S3_ACCESS_KEY: ${KNOWLEDGE_S3_ACCESS_KEY:-${OPENAGENTS_MINIO_ROOT_USER:-openagents}}
      KNOWLEDGE_S3_SECRET_KEY: ${KNOWLEDGE_S3_SECRET_KEY:-${OPENAGENTS_MINIO_ROOT_PASSWORD:?OPENAGENTS_MINIO_ROOT_PASSWORD is required; run scripts/docker-deploy.sh}}
      KNOWLEDGE_S3_BUCKET: ${KNOWLEDGE_S3_BUCKET:-openagents-knowledge}
    volumes:
      - *openagents_home_mount
      - *openagents_logs_mount
      - type: bind
        # Keep config files outside images so the same version can be promoted
        # across environments without a rebuild.
        source: ${OPENAGENTS_CONFIG_FILE:-./config.yaml}
        target: /app/config.yaml
        read_only: true
      - type: bind
        source: ${OPENAGENTS_GATEWAY_CONFIG_FILE:-./gateway.yaml}
        target: /app/backend/gateway/gateway.yaml
        read_only: true
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8001/health"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 30s
    logging: *json_logging
    restart: unless-stopped

  nginx:
    image: ${OPENAGENTS_WEB_IMAGE:-${OPENAGENTS_IMAGE_REGISTRY:-docker.io}/${OPENAGENTS_IMAGE_PREFIX:-zhangxuan2/openagents}-web:${OPENAGENTS_VERSION:-latest}}
    depends_on:
      gateway:
        condition: service_healthy
      onlyoffice:
        condition: service_healthy
    ports:
      - "${OPENAGENTS_APP_PORT:-8083}:80"
      - "${OPENAGENTS_ADMIN_PORT:-8081}:8081"
    volumes:
      - *openagents_logs_mount
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 30s
    logging: *json_logging
    restart: unless-stopped
